name: Qualidade e reprodução
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Testes unitários
        run: python -m pytest -q
      - name: Reproduzir análise completa
        run: python -m src.pipeline
      - name: Validar integração e dashboard
        run: python -m pytest -q
      - name: Executar notebooks
        run: python scripts/execute_notebooks.py
      - uses: actions/upload-artifact@v4
        with:
          name: resultados-reproduzidos
          path: reports/
